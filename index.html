<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나루민턴 자체대회 시스템</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --text-color: #333; --sub-text: #666;
            --card-bg: white; --border-color: #ccc;
            --blue-bg: #e8f4f8; --blue-border: #bce8f1; --blue-text: #0b5394;
            --red-bg: #fce8e8; --red-border: #f2dede; --red-text: #cc0000;
            --win-blue-bg: #c4e3f3; --win-red-bg: #fbd5d5;
            --highlight-bg: #fffacd; --modal-bg: rgba(0,0,0,0.5);
        }

        body.dark-mode {
            --bg-color: #121212; --text-color: #e0e0e0; --sub-text: #aaa;
            --card-bg: #1e1e1e; --border-color: #444;
            --blue-bg: #0a1f33; --blue-border: #0b5394; --blue-text: #6baed6;
            --red-bg: #330a0a; --red-border: #cc0000; --red-text: #fb6a4a;
            --win-blue-bg: #0d3b66; --win-red-bg: #660d0d;
            --highlight-bg: #5c4d05; --modal-bg: rgba(0,0,0,0.8);
        }

        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
        
        .header { text-align: center; margin-bottom: 15px; position: relative; }
        .header h1 { color: var(--blue-text); font-size: 24px; margin: 0 0 10px 0; }
        .header p { color: var(--sub-text); font-size: 14px; margin: 0; }
        .dark-mode-btn { position: absolute; top: 0; right: 0; background: none; border: none; font-size: 20px; cursor: pointer; }

        .scoreboard-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .score-box-main { flex: 1; max-width: 150px; text-align: center; padding: 15px 10px; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .score-blue { background-color: var(--blue-bg); border: 2px solid var(--blue-border); color: var(--blue-text); }
        .score-red { background-color: var(--red-bg); border: 2px solid var(--red-border); color: var(--red-text); }
        .score-num { font-size: 28px; display: block; margin-top: 5px; }

        .ranking-board {
            background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--border-color);
        }
        .ranking-title { font-size: 16px; font-weight: bold; color: var(--text-color); margin: 0 0 10px 0; text-align: center; }
        .rank-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border-color); }
        .rank-item:last-child { border-bottom: none; }
        .rank-medal { font-size: 18px; width: 30px; text-align: center; }
        .rank-name { flex: 1; font-weight: bold; margin-left: 10px; cursor: pointer; color: var(--text-color); }
        .rank-stat { font-size: 13px; color: var(--sub-text); font-weight: bold; background: var(--bg-color); padding: 3px 8px; border-radius: 12px; }

        .search-box { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .search-box input { padding: 12px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px; text-align: center; margin-bottom: 5px; background: var(--card-bg); color: var(--text-color); }
        .btn { padding: 12px 15px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; flex: 1; max-width: 120px;}
        .btn-search { background-color: #0b5394; }
        .btn-all { background-color: #555555; }
        .btn-team { background-color: #2e7d32; }
        
        .match-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 6px solid var(--border-color); transition: background-color 0.3s; }
        .match-card.event { border-left-color: #f1c232; background-color: #fffde7; }
        body.dark-mode .match-card.event { background-color: #4a452a; }
        
        .round-title { font-size: 18px; color: var(--blue-text); border-bottom: 2px solid var(--blue-text); padding-bottom: 5px; margin: 25px 0 15px 0; font-weight: bold; }
        .time { font-size: 14px; color: var(--sub-text); font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }
        .court { font-size: 16px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        
        .teams { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        
        .team { 
            flex: 1; text-align: center; 
            padding: 12px 2px;
            border-radius: 8px; font-weight: bold; transition: all 0.3s;
            word-break: keep-all; letter-spacing: -0.5px;
        }
        
        .team-a { background-color: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-text); }
        .team-b { background-color: var(--red-bg); border: 1px solid var(--red-border); color: var(--red-text); }
        .vs { font-weight: bold; color: var(--sub-text); margin: 0 6px; }
        
        .score-box { font-size: 20px; font-weight: 900; margin-top: 8px; color: var(--text-color); letter-spacing: 0; }
        .winner-a { background-color: var(--win-blue-bg); border: 2px solid var(--blue-border); transform: scale(1.05); z-index: 10; box-shadow: 0 0 10px rgba(11,83,148,0.3); }
        .winner-b { background-color: var(--win-red-bg); border: 2px solid var(--red-border); transform: scale(1.05); z-index: 10; box-shadow: 0 0 10px rgba(204,0,0,0.3); }
        .winner-a .score-box { color: var(--blue-text); font-size: 26px; }
        .winner-b .score-box { color: var(--red-text); font-size: 26px; }
        .loser { opacity: 0.5; filter: grayscale(50%); }

        .player-click { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; padding: 2px 2px; border-radius: 4px; transition: background 0.2s; }
        .player-click:active { background-color: rgba(0,0,0,0.1); }
        
        .highlight { color: #d90429; font-weight: 900; background-color: var(--highlight-bg); text-decoration-style: solid; }
        body.dark-mode .highlight { color: #ff6b6b; }
        .empty-msg { text-align: center; font-size: 16px; color: var(--sub-text); margin-top: 30px; line-height: 1.5; }
        
        .faction-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
        .faction-box { flex: 1 1 45%; min-width: 140px; background: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .faction-box.blue { border-top: 6px solid var(--blue-border); }
        .faction-box.red { border-top: 6px solid var(--red-border); }
        .faction-title { text-align: center; font-size: 18px; font-weight: bold; margin: 0 0 15px 0; }
        .name-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 4px; cursor: pointer; }
        .badge-blue { background-color: var(--blue-bg); color: var(--blue-text); border: 1px solid var(--blue-border); }
        .badge-red { background-color: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-border); }

        .scroll-top-btn {
            display: none; position: fixed; bottom: 30px; right: 30px; z-index: 90; 
            font-size: 16px; font-weight: bold; border: none; outline: none; 
            background-color: #0b5394; color: white; cursor: pointer; 
            padding: 15px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-bg); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg); padding: 25px; border-radius: 15px; width: 80%; max-width: 300px;
            text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); position: relative;
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .modal-close { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; color: var(--sub-text); cursor: pointer; border: none; background: none; }
        .modal-name { font-size: 24px; font-weight: bold; color: var(--text-color); margin: 10px 0 5px 0; }
        .modal-team { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 12px; display: inline-block; margin-bottom: 15px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; background: var(--bg-color); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .stat-label { font-size: 12px; color: var(--sub-text); }
        .stat-val { font-size: 16px; font-weight: bold; color: var(--text-color); }
        .stat-diff-pos { color: #2e7d32; }
        .stat-diff-neg { color: #c62828; }
        
        /* 🚀 팝업 내 검색 버튼 스타일 */
        .btn-modal-search {
            width: 100%; padding: 12px; font-size: 14px; font-weight: bold; color: white;
            background-color: #0b5394; border: none; border-radius: 8px; cursor: pointer;
            margin-top: 5px; transition: background-color 0.2s;
        }
        .btn-modal-search:active { background-color: #083c6b; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏸 나루민턴 실시간 중계</h1>
        <p>이름 검색, 전체 일정, 점수 및 진영을 확인하세요!</p>
        <button class="dark-mode-btn" id="darkModeToggle" onclick="toggleDarkMode()">🌙</button>
    </div>

    <!-- 팀 종합 스코어 -->
    <div class="scoreboard-container">
        <div class="score-box-main score-blue">
            🔵 청팀
            <span class="score-num" id="totalBlueWins">0승</span>
        </div>
        <div class="score-box-main score-red">
            🔴 홍팀
            <span class="score-num" id="totalRedWins">0승</span>
        </div>
    </div>

    <!-- 실시간 명예의 전당 -->
    <div class="ranking-board">
        <div class="ranking-title">🏆 실시간 다승왕 랭킹 Top 3</div>
        <div id="rankingList">
            <p class="empty-msg" style="margin-top: 10px; font-size: 13px;">아직 종료된 경기가 없습니다.</p>
        </div>
    </div>

    <div style="text-align: center; width: 100%;">
        <div class="search-box">
            <input type="text" id="playerName" placeholder="이름을 입력하세요" onkeypress="if(event.keyCode==13) clickSearch()">
        </div>
        <div class="search-box">
            <button class="btn btn-search" onclick="clickSearch()">내 일정</button>
            <button class="btn btn-all" onclick="clickAll()">전체 일정</button>
            <button class="btn btn-team" onclick="clickTeam()">출전 팀 명단</button>
        </div>
    </div>

    <div id="results"></div>
    <button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()">⬆️</button>

    <!-- 개인 전적 돋보기 모달 -->
    <div class="modal-overlay" id="playerModal" onclick="if(event.target===this) closePlayerModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closePlayerModal()">×</button>
            <div id="modalTeamBadge" class="modal-team badge-blue">🔵 청팀</div>
            <div class="modal-name" id="modalName">강동우</div>
            <div class="stat-grid">
                <div>
                    <div class="stat-label">총 출전</div>
                    <div class="stat-val" id="modalMatches">0전</div>
                </div>
                <div>
                    <div class="stat-label">전적</div>
                    <div class="stat-val" id="modalWLT">0승 0패</div>
                </div>
                <div>
                    <div class="stat-label">승률</div>
                    <div class="stat-val" id="modalWinRate">0%</div>
                </div>
                <div>
                    <div class="stat-label">득실차</div>
                    <div class="stat-val stat-diff-pos" id="modalDiff">+0</div>
                </div>
            </div>
            <!-- 🚀 팝업 내 경기 모아보기 버튼 -->
            <button class="btn-modal-search" onclick="searchFromModal()">🔍 이 선수 경기 모아보기</button>
            <p style="font-size: 11px; color: var(--sub-text); margin-top: 10px; margin-bottom: 0;">진행이 완료된 경기 기준입니다.</p>
        </div>
    </div>

    <script>
        let scheduleData = [];
        let blueTeam = [];
        let redTeam = [];
        let currentViewMode = 'all'; 
        let currentSearchName = '';

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('narumintonDarkMode', isDark);
            document.getElementById('darkModeToggle').innerText = isDark ? '☀️' : '🌙';
        }
        if (localStorage.getItem('narumintonDarkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('darkModeToggle').innerText = '☀️';
        }

        function getPlayerStats() {
            let stats = {};
            blueTeam.forEach(p => stats[p] = { name: p, team: 'blue', matches: 0, wins: 0, diff: 0 });
            redTeam.forEach(p => stats[p] = { name: p, team: 'red', matches: 0, wins: 0, diff: 0 });

            scheduleData.forEach(round => {
                round.matches.forEach(match => {
                    if (match.is_event) return;
                    const sa = parseInt(match.score_a, 10);
                    const sb = parseInt(match.score_b, 10);
                    let winner = null;
                    
                    if (!isNaN(sa) && !isNaN(sb)) {
                        if (sa > sb) winner = 'A';
                        else if (sb > sa) winner = 'B';
                    }

                    match.team_a.forEach(p => {
                        if (!stats[p]) stats[p] = { name: p, team: 'blue', matches: 0, wins: 0, diff: 0 };
                        if (!isNaN(sa) && !isNaN(sb)) {
                            stats[p].matches++;
                            stats[p].diff += (sa - sb);
                            if (winner === 'A') stats[p].wins++;
                        }
                    });
                    
                    match.team_b.forEach(p => {
                        if (!stats[p]) stats[p] = { name: p, team: 'red', matches: 0, wins: 0, diff: 0 };
                        if (!isNaN(sa) && !isNaN(sb)) {
                            stats[p].matches++;
                            stats[p].diff += (sb - sa);
                            if (winner === 'B') stats[p].wins++;
                        }
                    });
                });
            });
            return stats;
        }

        function updateRankingBoard(stats) {
            let players = Object.values(stats).filter(p => p.matches > 0);
            
            players.sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                if (b.diff !== a.diff) return b.diff - a.diff;
                return a.matches - b.matches;
            });

            const top3 = players.slice(0, 3);
            const rankDiv = document.getElementById('rankingList');
            
            if (top3.length === 0) {
                rankDiv.innerHTML = '<p class="empty-msg" style="margin-top: 10px; font-size: 13px;">아직 종료된 경기가 없습니다.</p>';
                return;
            }

            let html = '';
            top3.forEach((p, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                const teamIcon = p.team === 'blue' ? '🔵' : '🔴';
                const sign = p.diff > 0 ? '+' : '';
                html += `
                    <div class="rank-item">
                        <span class="rank-medal">${medal}</span>
                        <span class="rank-name" onclick="openPlayerModal('${p.name}')">${teamIcon} ${p.name}</span>
                        <span class="rank-stat">${p.wins}승 (득실 ${sign}${p.diff})</span>
                    </div>
                `;
            });
            rankDiv.innerHTML = html;
        }

        function openPlayerModal(playerName) {
            const stats = getPlayerStats()[playerName];
            if (!stats) return;

            document.getElementById('modalName').innerText = playerName;
            
            const teamBadge = document.getElementById('modalTeamBadge');
            if (stats.team === 'blue') {
                teamBadge.className = 'modal-team badge-blue';
                teamBadge.innerText = '🔵 청팀';
            } else {
                teamBadge.className = 'modal-team badge-red';
                teamBadge.innerText = '🔴 홍팀';
            }

            const losses = stats.matches - stats.wins;
            const winRate = stats.matches > 0 ? Math.round((stats.wins / stats.matches) * 100) : 0;
            const diffEl = document.getElementById('modalDiff');

            document.getElementById('modalMatches').innerText = stats.matches + "전";
            document.getElementById('modalWLT').innerText = stats.wins + "승 " + losses + "패";
            document.getElementById('modalWinRate').innerText = winRate + "%";
            
            diffEl.innerText = (stats.diff > 0 ? '+' : '') + stats.diff;
            diffEl.className = 'stat-val ' + (stats.diff >= 0 ? 'stat-diff-pos' : 'stat-diff-neg');

            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayerModal() {
            document.getElementById('playerModal').style.display = 'none';
        }

        // 🚀 팝업 안에서 바로 검색을 실행하는 함수
        function searchFromModal() {
            const targetName = document.getElementById('modalName').innerText;
            document.getElementById('playerName').value = targetName; // 검색창에 이름 세팅
            closePlayerModal(); // 팝업 닫기
            clickSearch(); // 검색 실행
        }

        function loadData(isAuto = false) {
            fetch('web_schedule.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    scheduleData = data.schedule || [];
                    blueTeam = data.blue_team || [];
                    redTeam = data.red_team || [];
                    
                    const allStats = getPlayerStats();
                    updateTotalScoreboard(allStats); 
                    updateRankingBoard(allStats);
                    
                    if (currentViewMode === 'search') renderSearch(currentSearchName);
                    else if (currentViewMode === 'team') renderTeam();
                    else renderAll();
                })
                .catch(error => {
                    if (!isAuto) {
                        document.getElementById('results').innerHTML = "<p class='empty-msg'>일정 데이터를 불러오지 못했습니다.<br>관리자가 곧 업로드할 예정입니다.</p>";
                    }
                });
        }

        function updateTotalScoreboard(stats) {
            let blueWins = 0, redWins = 0;
            scheduleData.forEach(round => {
                round.matches.forEach(match => {
                    if (match.is_event) return;
                    const sa = parseInt(match.score_a, 10);
                    const sb = parseInt(match.score_b, 10);
                    if (!isNaN(sa) && !isNaN(sb)) {
                        if (sa > sb) blueWins++;
                        else if (sb > sa) redWins++;
                    }
                });
            });
            document.getElementById('totalBlueWins').innerText = blueWins + "승";
            document.getElementById('totalRedWins').innerText = redWins + "승";
        }

        loadData(false);
        setInterval(() => { loadData(true); }, 30000); 

        function clickSearch() {
            const nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) {
                document.getElementById('results').innerHTML = "<p class='empty-msg'>검색할 이름을 입력해주세요.</p>";
                return;
            }
            currentViewMode = 'search';
            currentSearchName = nameInput;
            renderSearch(currentSearchName);
        }

        function clickAll() {
            currentViewMode = 'all';
            document.getElementById('playerName').value = ''; 
            renderAll();
        }

        function clickTeam() {
            currentViewMode = 'team';
            document.getElementById('playerName').value = ''; 
            renderTeam();
        }

        function createMatchHTML(match, nameInput = null) {
            if (match.is_event) {
                return `<div class="match-card event">
                            <div class="court">🏸 ${match.court}번 코트</div>
                            <div style="text-align:center; font-weight:bold; color:#b45f06; padding: 10px 0;">⭐ 특별 이벤트 타임 ⭐</div>
                        </div>`;
            }

            const teamA = match.team_a || [];
            const teamB = match.team_b || [];
            const scoreA = match.score_a || "";
            const scoreB = match.score_b || "";
            const numA = parseInt(scoreA, 10);
            const numB = parseInt(scoreB, 10);
            
            let isWinnerA = false, isWinnerB = false;
            if (!isNaN(numA) && !isNaN(numB)) {
                if (numA > numB) isWinnerA = true;
                else if (numB > numA) isWinnerB = true;
            }

            const classA = "team team-a" + (isWinnerA ? " winner-a" : "") + (isWinnerB ? " loser" : "");
            const classB = "team team-b" + (isWinnerB ? " winner-b" : "") + (isWinnerA ? " loser" : "");
            const iconA = isWinnerA ? "👑" : "🔵";
            const iconB = isWinnerB ? "👑" : "🔴";
            const displayScoreA = scoreA ? `<div class="score-box">${scoreA}</div>` : "";
            const displayScoreB = scoreB ? `<div class="score-box">${scoreB}</div>` : "";

            const clickableNames = (arr) => {
                return arr.map(p => {
                    const isSearched = nameInput && p.includes(nameInput);
                    const hlClass = isSearched ? 'highlight' : '';
                    return `<span class="player-click ${hlClass}" onclick="openPlayerModal('${p}')">${p}</span>`;
                }).join(', ');
            };

            let borderColor = "var(--border-color)";
            if (nameInput) {
                if (teamB.some(p => p.includes(nameInput))) borderColor = "var(--red-border)";
                else if (teamA.some(p => p.includes(nameInput))) borderColor = "var(--blue-border)";
            }

            return `
                <div class="match-card" style="border-left-color: ${borderColor};">
                    <div class="court">🏸 ${match.court}번 코트 &nbsp;|&nbsp; 🏅 ${match.category}</div>
                    <div class="teams">
                        <div class="${classA}">
                            <div>${iconA} ${clickableNames(teamA)}</div>
                            ${displayScoreA}
                        </div>
                        <div class="vs">VS</div>
                        <div class="${classB}">
                            <div>${iconB} ${clickableNames(teamB)}</div>
                            ${displayScoreB}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSearch(nameInput) {
            const resultsDiv = document.getElementById('results');
            let matchCount = 0; let htmlStr = "";
            scheduleData.forEach(round => {
                const timeStr = round.time || `${round.round}회차`;
                round.matches.forEach(match => {
                    if (match.is_event) return; 
                    const teamA = match.team_a || [];
                    const teamB = match.team_b || [];
                    if (teamA.some(p => p.includes(nameInput)) || teamB.some(p => p.includes(nameInput))) {
                        matchCount++;
                        htmlStr += `<div class="time">🕒 ${timeStr}</div>`;
                        htmlStr += createMatchHTML(match, nameInput);
                    }
                });
            });
            if (matchCount === 0) resultsDiv.innerHTML = `<p class='empty-msg'>'<b>${nameInput}</b>' 선수의 출전 일정이 없습니다.</p>`;
            else resultsDiv.innerHTML = `<div style="text-align:center; margin-bottom:20px; font-weight:bold; color:var(--blue-text);">✅ [${nameInput}]님은 총 <b>${matchCount}경기</b> 출전합니다.</div>` + htmlStr;
        }

        function renderAll() {
            const resultsDiv = document.getElementById('results');
            let htmlStr = "";
            scheduleData.forEach(round => {
                const timeStr = round.time || `${round.round}회차`;
                htmlStr += `<div class="round-title">🕒 ${timeStr}</div>`;
                round.matches.forEach(match => {
                    htmlStr += createMatchHTML(match, null);
                });
            });
            resultsDiv.innerHTML = htmlStr;
        }

        function renderTeam() {
            const resultsDiv = document.getElementById('results');
            if (blueTeam.length === 0 && redTeam.length === 0) {
                resultsDiv.innerHTML = `<div class="round-title">👥 대회 참가 진영 명단</div><p class='empty-msg'>명단이 아직 생성되지 않았습니다.</p>`;
                return;
            }

            let html = `<div class="round-title">👥 대회 참가 진영 명단</div><div class="faction-container">`;
            html += `<div class="faction-box blue">
                        <h3 class="faction-title" style="color:var(--blue-text);">🔵 청팀 (총 ${blueTeam.length}명)</h3>
                        <div style="text-align:center;">
                            ${blueTeam.map(name => `<span class="name-badge badge-blue" onclick="openPlayerModal('${name}')">${name}</span>`).join('')}
                        </div>
                    </div>`;

            html += `<div class="faction-box red">
                        <h3 class="faction-title" style="color:var(--red-text);">🔴 홍팀 (총 ${redTeam.length}명)</h3>
                        <div style="text-align:center;">
                            ${redTeam.map(name => `<span class="name-badge badge-red" onclick="openPlayerModal('${name}')">${name}</span>`).join('')}
                        </div>
                    </div></div>`;
            
            resultsDiv.innerHTML = html;
        }

        window.onscroll = function() {
            const btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
